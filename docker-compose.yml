# Local loop aligned with CI: Node 22 + pnpm 9 (see scripts/docker-dev.sh).
#
# Images are official multi-arch manifests (linux/amd64 and linux/arm64).
# Apple Silicon pulls arm64. Do not set platform: or DOCKER_DEFAULT_PLATFORM.
#
# Feed only (no Mongo):
#   docker compose up
# Hangouts/chat, with a Mongo stub:
#   docker compose --profile chat up
#
# `depends_on.required: false` needs Docker Compose v2.20 or newer
# (current Docker Desktop). Feed-only starts do not wait on mongo.

services:
  app:
    image: node:22-bookworm
    working_dir: /workspace
    init: true
    ports:
      - "3310:3310"
    volumes:
      - .:/workspace
      # Keep install artifacts off the host tree so a macOS node_modules
      # cannot shadow the linux/arm64 (or amd64) install inside the container.
      - app-node-modules:/workspace/node_modules
      - composer-node-modules:/workspace/packages/composer/node_modules
      - renderer-node-modules:/workspace/packages/renderer/node_modules
      - operations-node-modules:/workspace/packages/operations/node_modules
      - chat-client-node-modules:/workspace/packages/chat-client/node_modules
      - pnpm-store:/pnpm
    environment:
      # Docker Desktop on macOS does not forward inotify events from the bind mount.
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      COREPACK_HOME: /pnpm/corepack
    command: ["bash", "scripts/docker-dev.sh"]
    depends_on:
      mongo:
        condition: service_healthy
        required: false

  mongo:
    profiles: ["chat"]
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

volumes:
  app-node-modules:
  composer-node-modules:
  renderer-node-modules:
  operations-node-modules:
  chat-client-node-modules:
  pnpm-store:
  mongo-data:
